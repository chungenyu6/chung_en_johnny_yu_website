# See docs at: https://mystmd.org/guide/frontmatter
version: 1
project:
  id: e0d75714-8b7a-4ea2-9c69-e2a40c75933d
  title: AI Learning Notes
  description: Hands-on notebooks for machine learning and large language models.
  keywords:
    - machine learning
    - large language models
    - PyTorch
    - Jupyter notebooks
  authors:
    - name: Chung-En (Johnny) Yu
  github: https://github.com/chungenyu6/ai-learning-notebooks
  exclude: 
    - README.md
    - my-note/**
  toc:
    - file: 00-home.md
    - title: Machine Learning
      children:
        - file: 01-ML/00-toc-ml.md
        - pattern: '01-ML/*.ipynb'
          sort: ascending
    - title: Large Language Models
      children:
        - file: 02-LLM/00-toc-llm.md
        - pattern: '02-LLM/*.ipynb'
          sort: ascending

site:
  template: book-theme
  options:
    favicon: web_img/site_icon.ico
    logo: web_img/site_logo3.png
